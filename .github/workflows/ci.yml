name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: "Install dependencies (CPU torch, then the package with dev extras)"
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      - name: "Lint (syntax errors and pyflakes)"
        run: ruff check src tests scripts

      - name: "Format check (advisory, code base predates black)"
        continue-on-error: true
        run: black --check src tests

      - name: "Type check (advisory)"
        continue-on-error: true
        run: mypy src

      - name: "Tests with coverage (real-data tests skip when data/ and models/ are absent)"
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=40

      - name: "CLI smoke"
        run: |
          frame2threat --help
          python -m src.data.build_store --synthetic --output-dir data/store/smoke
          python scripts/run_pipeline.py --smoke --synthetic --output-dir data/repro/v1_smoke

  lockfile:
    name: Lock file is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install poetry
      - run: poetry check --lock
